
networks:
  argendar_net:
    driver: bridge

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: argendar_backend
    ports:
      - "3000:3000"
    volumes:
      - ./backend:/app
      - /app/node_modules # Volumen anónimo: protege los binarios de Linux de ser pisados
    env_file:
      - ./backend/.env
    networks:
      - argendar_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: argendar_frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    env_file:
      - ./frontend/.env
    environment:
      - BACKEND_URL=http://backend:3000
    networks:
      - argendar_net
    depends_on:
      - backend